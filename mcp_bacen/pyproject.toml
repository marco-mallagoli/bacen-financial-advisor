[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-bacen"
version = "0.1.0"
description = "MCP server for Banco Central do Brasil (BACEN / API Olinda) open data: Ranking de Reclamações, Pix/SPI/DICT/MED, credit interest rates and banking fees."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mcp>=2.3.0,<3",
    "httpx>=0.28.0",
    "polars>=1.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "opentelemetry-api>=1.30.0,<2",
    "opentelemetry-sdk>=1.30.0,<2",
    "opentelemetry-exporter-gcp-trace>=1.9.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
mcp-bacen = "src.main:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
